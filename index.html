<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Particles - Master Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 5px #000;
            line-height: 1.5;
        }
        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            transform: scaleX(-1); /* Mirror the video */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffcc;
            font-size: 24px;
            z-index: 20;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="info">
        <h1>Master Shape Shifter</h1>
        <p>
            🖐 <b>Open:</b> Cloud | ✊ <b>Fist:</b> Butterfly 🦋 | 🤏 <b>Pinch:</b> Heart ❤️<br>
            ✌️ <b>Peace:</b> Star ⭐ | ☝️ <b>Point:</b> DNA Helix 🧬
        </p>
    </div>
    <div id="loading">Initialize Camera...</div>
    <div id="video-container">
        <video class="input_video"></video>
    </div>

<script>
    // --- 1. SETUP THREE.JS ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 45; 

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 2. CALCULATE SHAPES ---
    const particleCount = 20000; 
    const geometry = new THREE.BufferGeometry();
    
    const initialPositions = []; // Cloud
    const heartPositions = [];   // Heart
    const butterflyPositions = []; // Butterfly
    const starPositions = [];    // Star
    const helixPositions = [];   // DNA Helix
    
    const colors = [];

    // Colors
    const colBlue = new THREE.Color(0x00ffff);
    const colRed = new THREE.Color(0xff0033);
    const colPurple = new THREE.Color(0xaa00ff);
    const colGold = new THREE.Color(0xffd700);
    const colGreen = new THREE.Color(0x00ff00);

    function randomPoint(scale) {
        return (Math.random() - 0.5) * scale;
    }

    for (let i = 0; i < particleCount; i++) {
        // 1. CLOUD
        initialPositions.push(randomPoint(70), randomPoint(50), randomPoint(50));

        // 2. HEART (Parametric)
        const t = Math.random() * Math.PI * 2;
        let hx = 16 * Math.pow(Math.sin(t), 3);
        let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        let hz = (Math.random() - 0.5) * 6; 
        heartPositions.push(hx * 0.8, hy * 0.8, hz);

        // 3. BUTTERFLY (Parametric)
        const tb = Math.random() * 12 * Math.PI; 
        const r = Math.exp(Math.cos(tb)) - 2 * Math.cos(4*tb) + Math.pow(Math.sin(tb/12), 5);
        let bx = r * Math.sin(tb) * 6;
        let by = r * Math.cos(tb) * 6 - 5;
        let bz = (Math.random() - 0.5) * 5;
        butterflyPositions.push(bx, by, bz);

        // 4. STAR (5-Pointed)
        // We use polar coordinates. 5 points means peaks at 0, 72, 144...
        const ts = Math.random() * Math.PI * 2;
        // Radius fluctuates to create spikes
        const starR = 10 + 5 * Math.cos(5 * ts); 
        // Add some random scatter for volume
        const finalR = starR * (0.8 + Math.random() * 0.4);
        
        let sx = finalR * Math.cos(ts);
        let sy = finalR * Math.sin(ts);
        let sz = (Math.random() - 0.5) * 4; // Thickness
        starPositions.push(sx, sy, sz);

        // 5. DNA HELIX
        // Two strands twisting up
        const th = (i / particleCount) * 10 * Math.PI; // Height factor
        const strand = (i % 2 === 0) ? 1 : -1; // Split particles into two strands
        
        let hlx = Math.cos(th) * 6;
        let hlz = Math.sin(th) * 6 + (strand * 3); // Offset strands
        let hly = (i / particleCount) * 40 - 20; // Spread vertically
        
        // Add some noise
        hlx += (Math.random()-0.5);
        hlz += (Math.random()-0.5);
        
        helixPositions.push(hlx, hly, hlz);

        // Initial Colors
        colors.push(colBlue.r, colBlue.g, colBlue.b);
    }

    const currentPositions = new Float32Array(initialPositions);
    geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.3,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.8
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // --- 3. GESTURE LOGIC ---
    let handPos = new THREE.Vector3(0, 0, 0);
    let isHandPresent = false;
    let gestureMode = 'cloud'; 

    const videoElement = document.getElementsByClassName('input_video')[0];
    const loadingText = document.getElementById('loading');

    function onResults(results) {
        loadingText.style.display = 'none';

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            isHandPresent = true;
            const lm = results.multiHandLandmarks[0];
            const wrist = lm[0];
            
            // Map Hand Position
            const x = (0.5 - wrist.x) * 60; 
            const y = (0.5 - wrist.y) * 40;
            const z = 0; 
            handPos.lerp(new THREE.Vector3(x, y, z), 0.1);

            // -- Finger Landmarks --
            const thumbTip = lm[4];
            const indexTip = lm[8]; const indexBase = lm[5];
            const middleTip = lm[12]; const middleBase = lm[9];
            const ringTip = lm[16]; const ringBase = lm[13];
            const pinkyTip = lm[20]; const pinkyBase = lm[17];

            // -- Logic Helpers --
            // Check if a finger is "Up" (Tip is higher than Base - remember Y is flipped in MediaPipe usually, but simpler: compare distances)
            // Or easier: checks Y coordinates (0 is top, 1 is bottom)
            const isIndexUp = indexTip.y < indexBase.y;
            const isMiddleUp = middleTip.y < middleBase.y;
            const isRingUp = ringTip.y < ringBase.y;
            const isPinkyUp = pinkyTip.y < pinkyBase.y;

            // Pinch (Thumb + Index close)
            const pinchDist = Math.sqrt(Math.pow(thumbTip.x - indexTip.x, 2) + Math.pow(thumbTip.y - indexTip.y, 2));
            const isPinch = pinchDist < 0.05;

            // Fist (All fingers down/curled)
            const isFist = !isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp;

            // Peace Sign (Index & Middle Up, Ring & Pinky Down)
            const isPeace = isIndexUp && isMiddleUp && !isRingUp && !isPinkyUp;

            // Pointing (Index Up only)
            const isPoint = isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp;


            // -- SET MODES --
            if (isPinch) {
                gestureMode = 'heart';
            } else if (isFist) { 
                gestureMode = 'butterfly'; 
            } else if (isPeace) {
                gestureMode = 'star';
            } else if (isPoint) {
                gestureMode = 'helix';
            } else {
                gestureMode = 'cloud';
            }

        } else {
            isHandPresent = false;
            gestureMode = 'cloud';
        }
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 640, height: 480
    });
    cameraUtils.start();

    // --- 4. ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        const posAttribute = particles.geometry.attributes.position;
        const colorAttribute = particles.geometry.attributes.color;
        
        particles.rotation.y += 0.005; // Base rotation

        for (let i = 0; i < particleCount; i++) {
            const ix = i * 3;
            const iy = i * 3 + 1;
            const iz = i * 3 + 2;

            let targetX, targetY, targetZ;
            let targetR, targetG, targetB;
            let speed = 0.08;

            // 1. HEART (Red)
            if (gestureMode === 'heart' && isHandPresent) {
                targetX = heartPositions[ix] + handPos.x;
                targetY = heartPositions[iy] + handPos.y;
                targetZ = heartPositions[iz] + handPos.z;
                targetR = colRed.r; targetG = colRed.g; targetB = colRed.b;
            } 
            // 2. BUTTERFLY (Purple)
            else if (gestureMode === 'butterfly' && isHandPresent) {
                targetX = butterflyPositions[ix] + handPos.x;
                targetY = butterflyPositions[iy] + handPos.y;
                targetZ = butterflyPositions[iz] + handPos.z;
                targetR = colPurple.r; targetG = (butterflyPositions[iy]>0)?0.8:0; targetB = colPurple.b;
            }
            // 3. STAR (Gold)
            else if (gestureMode === 'star' && isHandPresent) {
                targetX = starPositions[ix] + handPos.x;
                targetY = starPositions[iy] + handPos.y;
                targetZ = starPositions[iz] + handPos.z;
                targetR = colGold.r; targetG = colGold.g; targetB = colGold.b;
            }
            // 4. DNA HELIX (Green)
            else if (gestureMode === 'helix' && isHandPresent) {
                targetX = helixPositions[ix] + handPos.x;
                targetY = helixPositions[iy] + handPos.y;
                targetZ = helixPositions[iz] + handPos.z;
                targetR = colGreen.r; targetG = colGreen.g; targetB = colGreen.b;
            }
            // 5. CLOUD (Blue/Default)
            else {
                if (isHandPresent) {
                    targetX = initialPositions[ix] + handPos.x;
                    targetY = initialPositions[iy] + handPos.y;
                    targetZ = initialPositions[iz] + handPos.z;
                } else {
                    targetX = initialPositions[ix];
                    targetY = initialPositions[iy];
                    targetZ = initialPositions[iz];
                }
                targetR = colBlue.r; targetG = colBlue.g; targetB = colBlue.b;
                speed = 0.03;
            }

            // Interpolate Position
            posAttribute.array[ix] += (targetX - posAttribute.array[ix]) * speed;
            posAttribute.array[iy] += (targetY - posAttribute.array[iy]) * speed;
            posAttribute.array[iz] += (targetZ - posAttribute.array[iz]) * speed;

            // Interpolate Color
            colorAttribute.array[ix] += (targetR - colorAttribute.array[ix]) * 0.05;
            colorAttribute.array[iy] += (targetG - colorAttribute.array[iy]) * 0.05;
            colorAttribute.array[iz] += (targetB - colorAttribute.array[iz]) * 0.05;
        }

        posAttribute.needsUpdate = true;
        colorAttribute.needsUpdate = true;
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
